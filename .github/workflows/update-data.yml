name: Update Site Data

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test automatici (dati fittizi, nessun segreto)
        run: python3 -m unittest discover -s tests

      - name: Update Portfolio prices
        # Il registro acquisti arriva dal Secret e non viene mai scritto nei file ne' nei log.
        env:
          PORTFOLIO_LEDGER: ${{ secrets.PORTFOLIO_LEDGER }}
        run: python3 portfolio_update.py

      - name: Controllo privacy (nessun dato riservato nei file pubblici)
        env:
          PORTFOLIO_LEDGER: ${{ secrets.PORTFOLIO_LEDGER }}
        run: python3 tools/check_privacy.py

      - name: Commit e push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet && exit 0
          git commit -m "Auto-update portfolio $(date +'%d/%m/%Y')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X ours origin main && git push && break
            echo "Retry $i..."
            sleep 5
          done
